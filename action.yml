name: Shorebird Patch
description: Create a new patch using the Shorebird CLI

branding:
  icon: package
  color: green

inputs:
  args:
    description: The arguments to pass to the Shorebird patch command
    required: false
    default: ""
  platform:
    description: The platform for which to create a patch (e.g. android, ios)
    required: true
  release-version:
    description: The release version to patch (e.g. 1.0.0+1). Use "latest" to target the release that was most recently updated.
    required: true
  working-directory:
    description: The working directory in which to run Shorebird
    required: false
    default: .

outputs:
  patch-number:
    description: The number of the patch that was created. Empty for --dry-run.
    value: ${{ steps.shorebird-patch.outputs.patch-number }}

runs:
  using: composite
  steps:
    - name: 🐦 Shorebird Patch
      shell: bash
      id: shorebird-patch
      working-directory: ${{ inputs.working-directory }}
      env:
        SHOREBIRD_ACTION_ARGS: ${{ inputs.args }}
        SHOREBIRD_ACTION_PLATFORM: ${{ inputs.platform }}
        SHOREBIRD_ACTION_RELEASE_VERSION: ${{ inputs.release-version }}
      run: |
        # No `set -u`: args may reference unset variables, which expand to
        # empty as they did in v1.0.0.
        set -eo pipefail

        # Parse args with shell quoting rules, matching v1.0.0 where args were
        # interpolated directly into the command line. Line continuations and
        # newlines (from YAML `|` blocks) are folded into spaces first so a
        # multi-line value stays one command. Variables set here are prefixed
        # so they can't shadow a variable that args expands.
        if [[ "$SHOREBIRD_ACTION_ARGS" == *$'\n'* ]]; then
          echo "::warning::inputs.args contains newlines; converting them to spaces. Consider using YAML '>-'."
        fi
        SHOREBIRD_ACTION_CONTINUATION=$'\\\n'
        SHOREBIRD_ACTION_ARGS="${SHOREBIRD_ACTION_ARGS//"$SHOREBIRD_ACTION_CONTINUATION"/ }"
        SHOREBIRD_ACTION_ARGS="${SHOREBIRD_ACTION_ARGS//$'\n'/ }"
        eval "set -- $SHOREBIRD_ACTION_ARGS"

        # --dry-run validates without publishing, so there's no patch number
        # to report. Flags after `--` go to Flutter, not shorebird.
        DRY_RUN=false
        for arg in "$@"; do
          [[ "$arg" == "--" ]] && break
          # -n may be grouped with other short flags, e.g. -vn.
          [[ "$arg" == "--dry-run" || "$arg" =~ ^-[A-Za-z]*n[A-Za-z]*$ ]] && DRY_RUN=true
        done

        LOG="$RUNNER_TEMP/shorebird-patch.log"
        shorebird patch "$SHOREBIRD_ACTION_PLATFORM" \
          --release-version "$SHOREBIRD_ACTION_RELEASE_VERSION" \
          "$@" \
          | tee "$LOG"

        if [[ "$DRY_RUN" == true ]]; then
          echo "Dry run succeeded; no patch was published."
          exit 0
        fi

        GREP_MATCH="$(grep -m1 -Ei "Published Patch (.*)" "$LOG" || true)"
        if [[ -n "$GREP_MATCH" ]]; then
          # Strip the non-number characters from the line
          PATCH_NUMBER="$(echo "$GREP_MATCH" | sed -E 's/^.+ Published Patch (.*)\!$/\1/')"
          echo "patch-number=$PATCH_NUMBER" >> "$GITHUB_OUTPUT"
        else
          echo "Failed to create patch"
          exit 1
        fi
